```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Loja - Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

        <div class="logo">
            Minha Loja
        </div>

        <nav>

            <a href="index.html">
                Início
            </a>

            <a href="produtos.html">
                Produtos
            </a>

            <a href="sobre.html">
                Sobre
            </a>

            <a href="cadastro.html">
                Cadastre-se
            </a>

            <a href="contato.html">
                Contato
            </a>

        </nav>

    </header>


    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main>

        <section class="cadastro">

            <h1>
                Cadastro de Produto
            </h1>

            <p>
                Cadastre seus produtos diretamente no banco de dados.
            </p>


            <!-- FORMULÁRIO -->

            <form id="formProduto">


                <!-- NOME -->

                <label for="nome">
                    Nome do produto:
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite o nome do produto"
                    required
                >


                <!-- DESCRIÇÃO -->

                <label for="descricao">
                    Descrição:
                </label>

                <textarea
                    id="descricao"
                    name="descricao"
                    placeholder="Digite a descrição do produto"
                    rows="4"
                ></textarea>


                <!-- CATEGORIA -->

                <label for="categoria">
                    Categoria:
                </label>

                <select
                    id="categoria"
                    name="categoria"
                    required
                >

                    <option value="">
                        Selecione uma categoria
                    </option>

                    <option value="Eletrônicos">
                        Eletrônicos
                    </option>

                    <option value="Informática">
                        Informática
                    </option>

                    <option value="Roupas">
                        Roupas
                    </option>

                    <option value="Casa">
                        Casa
                    </option>

                    <option value="Esportes">
                        Esportes
                    </option>

                    <option value="Outros">
                        Outros
                    </option>

                </select>


                <!-- PREÇO DE CUSTO -->

                <label for="preco_custo">
                    Preço de custo:
                </label>

                <input
                    type="number"
                    id="preco_custo"
                    name="preco_custo"
                    placeholder="0,00"
                    step="0.01"
                    min="0"
                    required
                >


                <!-- PREÇO DE VENDA -->

                <label for="preco_venda">
                    Preço de venda:
                </label>

                <input
                    type="number"
                    id="preco_venda"
                    name="preco_venda"
                    placeholder="0,00"
                    step="0.01"
                    min="0"
                    required
                >


                <!-- ESTOQUE -->

                <label for="estoque">
                    Quantidade em estoque:
                </label>

                <input
                    type="number"
                    id="estoque"
                    name="estoque"
                    placeholder="0"
                    min="0"
                    required
                >


                <!-- IMAGEM -->

                <label for="imagem">
                    URL da imagem:
                </label>

                <input
                    type="text"
                    id="imagem"
                    name="imagem"
                    placeholder="https://..."
                >


                <!-- BOTÃO -->

                <button
                    type="submit"
                    id="btnSalvar"
                >
                    Salvar Produto
                </button>


            </form>


            <!-- MENSAGEM -->

            <p id="mensagem"></p>

        </section>

    </main>


    <!-- =========================
         RODAPÉ
    ========================== -->

    <footer>

        <p>
            &copy; 2026 Minha Loja - Todos os direitos reservados.
        </p>

    </footer>


    <!-- =====================================================
         CONEXÃO COM SUPABASE
    ====================================================== -->

    <script>

        /*
         * ==================================================
         * DADOS DO SUPABASE
         * ==================================================
         */

        const SUPABASE_URL =
            "https://SEU-PROJETO.supabase.co";

        const SUPABASE_KEY =
            "SUA_CHAVE_PUBLICA";


        /*
         * ==================================================
         * CRIAR CONEXÃO
         * ==================================================
         */

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /*
         * ==================================================
         * FORMULÁRIO
         * ==================================================
         */

        const formulario =
            document.getElementById("formProduto");

        const mensagem =
            document.getElementById("mensagem");

        const btnSalvar =
            document.getElementById("btnSalvar");


        /*
         * ==================================================
         * CADASTRAR PRODUTO
         * ==================================================
         */

        formulario.addEventListener(
            "submit",
            async function(event) {

                // Impede o recarregamento da página
                event.preventDefault();


                // Desabilita o botão
                btnSalvar.disabled = true;

                btnSalvar.innerText =
                    "Salvando...";


                /*
                 * Pegar os valores do formulário
                 */

                const nome =
                    document.getElementById("nome").value.trim();

                const descricao =
                    document.getElementById("descricao").value.trim();

                const categoria =
                    document.getElementById("categoria").value;

                const preco_custo =
                    Number(
                        document.getElementById("preco_custo").value
                    );

                const preco_venda =
                    Number(
                        document.getElementById("preco_venda").value
                    );

                const estoque =
                    Number(
                        document.getElementById("estoque").value
                    );

                const imagem =
                    document.getElementById("imagem").value.trim();


                /*
                 * ==================================================
                 * VALIDAÇÃO
                 * ==================================================
                 */

                if (!nome) {

                    mensagem.innerText =
                        "Digite o nome do produto.";

                    btnSalvar.disabled = false;

                    btnSalvar.innerText =
                        "Salvar Produto";

                    return;
                }


                if (preco_venda < 0) {

                    mensagem.innerText =
                        "O preço de venda não pode ser negativo.";

                    btnSalvar.disabled = false;

                    btnSalvar.innerText =
                        "Salvar Produto";

                    return;
                }


                if (estoque < 0) {

                    mensagem.innerText =
                        "O estoque não pode ser negativo.";

                    btnSalvar.disabled = false;

                    btnSalvar.innerText =
                        "Salvar Produto";

                    return;
                }


                /*
                 * ==================================================
                 * ENVIAR PARA O SUPABASE
                 * ==================================================
                 */

                const { data, error } =
                    await supabaseClient
                        .from("produtos")
                        .insert([

                            {
                                nome: nome,

                                descricao: descricao,

                                categoria: categoria,

                                preco_custo: preco_custo,

                                preco_venda: preco_venda,

                                estoque: estoque,

                                imagem: imagem
                            }

                        ])
                        .select();


                /*
                 * ==================================================
                 * VERIFICAR ERRO
                 * ==================================================
                 */

                if (error) {

                    console.error(
                        "Erro ao cadastrar:",
                        error
                    );

                    mensagem.innerText =
                        "❌ Erro ao cadastrar o produto: " +
                        error.message;

                    btnSalvar.disabled = false;

                    btnSalvar.innerText =
                        "Salvar Produto";

                    return;
                }


                /*
                 * ==================================================
                 * SUCESSO
                 * ==================================================
                 */

                console.log(
                    "Produto cadastrado:",
                    data
                );


                mensagem.innerText =
                    "✅ Produto cadastrado com sucesso!";


                /*
                 * Limpar formulário
                 */

                formulario.reset();


                btnSalvar.disabled = false;

                btnSalvar.innerText =
                    "Salvar Produto";

            }
        );

    </script>


</body>

</html>
```
