<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja - Cadastre-se</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Minha Loja</div>
        <nav>
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="sobre.html">Sobre</a>
            <a href="cadastro.html">Cadastre-se</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <div class="form-group">
            <h2>Cadastro de Cliente</h2>
            <!-- Substitua SEU_ID_FORMSPREE pelo seu código do Formspree -->
            <form action="https://formspree.io/f/SEU_ID_FORMSPREE" method="POST">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="telefone">Telefone / WhatsApp</label>
                <input type="tel" id="telefone" name="telefone" required>

                <button type="submit" class="btn" style="width: 100%;">Criar Conta</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Minha Loja - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
